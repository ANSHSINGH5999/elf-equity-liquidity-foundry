services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elf
      POSTGRES_PASSWORD: elf
      POSTGRES_DB: elf
    ports:
      - "5432:5432"
    volumes:
      - elf_postgres_data:/var/lib/postgresql/data

volumes:
  elf_postgres_data:
